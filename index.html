<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D PARTICLE ROSE TO YuanWenqian</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            overflow: hidden; 
            background: #000000; 
            font-family: 'Courier New', monospace;
        }
        canvas { display: block; }
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            pointer-events: none;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div id="info">3D PARTICLE ROSE TO YuanWenqian</div>
    
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
// 正上方俯视（图2角度）
camera.position.set(0, 50, 0.01);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.2;
controls.enablePan = false;
controls.minDistance = 15;
controls.maxDistance = 60;
controls.target.set(0, 0, 0);

// ========== 锁定为正上方俯视，禁止任何倾斜 ==========
controls.minPolarAngle = 0;
controls.maxPolarAngle = 0.02;

// ========== 花冠顶部粒子 ==========
const particleCount = 30000;
const positions = new Float32Array(particleCount * 3);
const colors = new Float32Array(particleCount * 3);
const sizes = new Float32Array(particleCount);
const randoms = new Float32Array(particleCount);

const tempColor = new THREE.Color();
const cCore   = new THREE.Color(0xff0022);
const cInner  = new THREE.Color(0xff2244);
const cMid    = new THREE.Color(0xff4466);
const cOuter  = new THREE.Color(0xff6688);
const cEdge   = new THREE.Color(0xffbbcc);

function getRosePoint(i) {
    const layer = i / particleCount;
    let x, y, z;

    if (layer < 0.10) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 1.0 + Math.random() * 1.5;
        x = r * Math.sin(phi) * Math.cos(theta);
        y = r * Math.cos(phi) + 2.5;
        z = r * Math.sin(phi) * Math.sin(theta);
        tempColor.copy(cCore).lerp(cInner, Math.random());

    } else if (layer < 0.45) {
        const t = Math.random() * Math.PI * 2;
        const p = Math.random() * Math.PI * 0.55;
        const petals = 5;
        const petalMod = Math.abs(Math.cos(petals * t * 0.5));
        const r = 3.0 + petalMod * 3.5 + Math.random() * 0.8;
        const hf = Math.sin(p);
        const rr = r * (0.7 + 0.3 * hf);
        x = rr * Math.sin(p) * Math.cos(t);
        y = rr * Math.cos(p) + 3;
        z = rr * Math.sin(p) * Math.sin(t);
        const mix = (rr - 3) / 6;
        tempColor.copy(cInner).lerp(cMid, mix + Math.random() * 0.2);

    } else {
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(1 - Math.random() * 0.8);
        const petals = 7;
        const petalMod = Math.abs(Math.cos(petals * t * 0.5));
        let r = 5.5 + petalMod * 5.0 + Math.random() * 1.5;
        const flatten = Math.sin(p * 0.65);
        r *= (0.5 + 0.5 * flatten);
        x = r * Math.sin(p) * Math.cos(t);
        y = r * Math.cos(p) * 0.7 + 2;
        z = r * Math.sin(p) * Math.sin(t);
        const dist = Math.sqrt(x*x + z*z);
        const mix = Math.min(1, (dist - 5.5) / 10);
        tempColor.copy(cMid).lerp(cOuter, mix);
        if (mix > 0.5) tempColor.lerp(cEdge, (mix - 0.5) * 2);
    }

    x += (Math.random() - 0.5) * 0.5;
    y += (Math.random() - 0.5) * 0.5;
    z += (Math.random() - 0.5) * 0.5;

    return { x, y, z, color: tempColor.clone() };
}

for (let i = 0; i < particleCount; i++) {
    const p = getRosePoint(i);
    positions[i * 3] = p.x;
    positions[i * 3 + 1] = p.y;
    positions[i * 3 + 2] = p.z;
    colors[i * 3] = p.color.r;
    colors[i * 3 + 1] = p.color.g;
    colors[i * 3 + 2] = p.color.b;
    sizes[i] = Math.random() * 0.22 + 0.10;
    randoms[i] = Math.random();
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
geometry.setAttribute('random', new THREE.BufferAttribute(randoms, 1));

const material = new THREE.ShaderMaterial({
    uniforms: {
        time: { value: 0 },
        pixelRatio: { value: renderer.getPixelRatio() }
    },
    vertexShader: `
        attribute float size;
        attribute float random;
        varying vec3 vColor;
        varying float vRandom;
        uniform float time;
        uniform float pixelRatio;

        void main() {
            vColor = color;
            vRandom = random;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            
            float breathe = 1.0 + 0.10 * sin(time * 1.5 + random * 6.28);
            float twinkle = 1.0 + 0.20 * sin(time * 3.0 + random * 20.0);
            
            gl_PointSize = size * pixelRatio * 380.0 / -mvPosition.z * breathe * twinkle;
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
    fragmentShader: `
        varying vec3 vColor;
        varying float vRandom;
        uniform float time;

        void main() {
            vec2 c = gl_PointCoord - vec2(0.5);
            float d = length(c);
            if (d > 0.5) discard;
            
            float core = 1.0 - smoothstep(0.0, 0.12, d);
            float mid  = 1.0 - smoothstep(0.0, 0.30, d);
            float edge = 1.0 - smoothstep(0.0, 0.5, d);
            
            float glow = core * 2.5 + mid * 1.0 + edge * 0.2;
            vec3 col = vColor * (1.2 + glow * 2.0);
            col = max(col, vColor * 0.8);
            
            gl_FragColor = vec4(col, edge * 0.92);
        }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexColors: true
});

const particles = new THREE.Points(geometry, material);
scene.add(particles);

// 环境粒子
const ambientCount = 600;
const aPos = new Float32Array(ambientCount * 3);
const aColor = new Float32Array(ambientCount * 3);
for (let i = 0; i < ambientCount; i++) {
    aPos[i*3] = (Math.random() - 0.5) * 50;
    aPos[i*3+1] = (Math.random() - 0.5) * 50;
    aPos[i*3+2] = (Math.random() - 0.5) * 50;
    const intensity = 0.4 + Math.random() * 0.4;
    aColor[i*3] = 1.0;
    aColor[i*3+1] = 0.5 + Math.random() * 0.3;
    aColor[i*3+2] = 0.6 + Math.random() * 0.2;
}
const aGeo = new THREE.BufferGeometry();
aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
aGeo.setAttribute('color', new THREE.BufferAttribute(aColor, 3));
const aMat = new THREE.PointsMaterial({
    size: 0.10,
    vertexColors: true,
    transparent: true,
    opacity: 0.3,
    blending: THREE.AdditiveBlending,
    depthWrite: false
});
const ambient = new THREE.Points(aGeo, aMat);
scene.add(ambient);

// 动画
const clock = new THREE.Clock();
function animate() {
    requestAnimationFrame(animate);
    const time = clock.getElapsedTime();
    material.uniforms.time.value = time;
    
    particles.rotation.y = time * 0.12;
    
    const floatY = Math.sin(time * 0.6) * 0.4;
    particles.position.y = floatY;
    
    ambient.rotation.y = -time * 0.03;
    ambient.rotation.x = time * 0.02;
    
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    material.uniforms.pixelRatio.value = renderer.getPixelRatio();
});
</script>
</body>
</html>
