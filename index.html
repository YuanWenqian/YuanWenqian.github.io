<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3D PARTICLE ROSE</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0a;
            font-family: 'Courier New', monospace;
        }
        canvas {
            display: block;
        }

        /* 底部文字 – 多行居中 */
        #info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
            text-align: center;          /* 关键：使换行后所有行居中 */
            white-space: normal;         /* 允许换行（默认就是 normal） */
            max-width: 90vw;             /* 防止过宽溢出屏幕 */
            padding: 0 10px;             /* 两侧留白，避免紧贴边缘 */
            box-sizing: border-box;
            line-height: 1.6;            /* 行距舒适 */
        }

        /* 加载遮罩（无文字，很快消失） */
        #loading-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            background: #0a0a0a;
            transition: opacity 0.8s ease;
            pointer-events: none;
        }
        #loading-overlay.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>

    <!-- 加载遮罩 -->
    <div id="loading-overlay"></div>

    <!-- 底部唯一文字 -->
    <div id="info">3D PARTICLE ROSE TO YUANWENQIAN</div>

    <!-- MediaPipe 脚本 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous">
    </script>

    <!-- Three.js 导入地图 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <!-- 主模块 -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ---------- DOM ----------
        const loadingOverlay = document.getElementById('loading-overlay');

        // ---------- 场景 ----------
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 48, 0.01);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // ---------- 控制器 ----------
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;
        controls.enablePan = false;
        controls.minDistance = 20;
        controls.maxDistance = 65;
        controls.target.set(0, 0, 0);
        controls.minPolarAngle = 0;
        controls.maxPolarAngle = 0.02;

        // ---------- 粒子数据 ----------
        const PARTICLE_COUNT = 32000;
        const cCore = new THREE.Color(0xff0022);
        const cInner = new THREE.Color(0xff2244);
        const cMid = new THREE.Color(0xff4466);
        const cOuter = new THREE.Color(0xff6688);
        const cEdge = new THREE.Color(0xffbbcc);

        function getRosePoint(i, total) {
            const layer = i / total;
            let x, y, z;
            const col = new THREE.Color();

            if (layer < 0.10) {
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                const r = 1.0 + Math.random() * 1.5;
                x = r * Math.sin(phi) * Math.cos(theta);
                y = r * Math.cos(phi) + 2.5;
                z = r * Math.sin(phi) * Math.sin(theta);
                col.copy(cCore).lerp(cInner, Math.random());
            } else if (layer < 0.45) {
                const t = Math.random() * Math.PI * 2;
                const p = Math.random() * Math.PI * 0.55;
                const petals = 5;
                const petalMod = Math.abs(Math.cos(petals * t * 0.5));
                const r = 3.0 + petalMod * 3.5 + Math.random() * 0.8;
                const hf = Math.sin(p);
                const rr = r * (0.7 + 0.3 * hf);
                x = rr * Math.sin(p) * Math.cos(t);
                y = rr * Math.cos(p) + 3;
                z = rr * Math.sin(p) * Math.sin(t);
                const mix = (rr - 3) / 6;
                col.copy(cInner).lerp(cMid, mix + Math.random() * 0.2);
            } else {
                const t = Math.random() * Math.PI * 2;
                const p = Math.acos(1 - Math.random() * 0.8);
                const petals = 7;
                const petalMod = Math.abs(Math.cos(petals * t * 0.5));
                let r = 5.5 + petalMod * 5.0 + Math.random() * 1.5;
                const flatten = Math.sin(p * 0.65);
                r *= (0.5 + 0.5 * flatten);
                x = r * Math.sin(p) * Math.cos(t);
                y = r * Math.cos(p) * 0.7 + 2;
                z = r * Math.sin(p) * Math.sin(t);
                const dist = Math.sqrt(x * x + z * z);
                const mix = Math.min(1, (dist - 5.5) / 10);
                col.copy(cMid).lerp(cOuter, mix);
                if (mix > 0.5) col.lerp(cEdge, (mix - 0.5) * 2);
            }

            x += (Math.random() - 0.5) * 0.5;
            y += (Math.random() - 0.5) * 0.5;
            z += (Math.random() - 0.5) * 0.5;
            return { x, y, z, color: col };
        }

        const aggPos = new Float32Array(PARTICLE_COUNT * 3);
        const dispPos = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        const sizes = new Float32Array(PARTICLE_COUNT);
        const randoms = new Float32Array(PARTICLE_COUNT);

        const SPREAD_RADIUS = 32;
        const SPREAD_HEIGHT = 24;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const p = getRosePoint(i, PARTICLE_COUNT);
            aggPos[i * 3] = p.x;
            aggPos[i * 3 + 1] = p.y;
            aggPos[i * 3 + 2] = p.z;

            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = SPREAD_RADIUS * Math.cbrt(Math.random()) * 0.9;
            dispPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            dispPos[i * 3 + 1] = (Math.random() - 0.5) * SPREAD_HEIGHT * 0.7 + 2;
            dispPos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

            colors[i * 3] = p.color.r;
            colors[i * 3 + 1] = p.color.g;
            colors[i * 3 + 2] = p.color.b;

            sizes[i] = Math.random() * 0.22 + 0.10;
            randoms[i] = Math.random();
        }

        // ---------- 粒子系统 ----------
        const geometry = new THREE.BufferGeometry();
        const currentPos = new Float32Array(aggPos);
        geometry.setAttribute('position', new THREE.BufferAttribute(currentPos, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
        geometry.setAttribute('random', new THREE.BufferAttribute(randoms, 1));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                pixelRatio: { value: renderer.getPixelRatio() },
            },
            vertexShader: `
                    attribute float size;
                    attribute float random;
                    varying vec3 vColor;
                    varying float vRandom;
                    uniform float time;
                    uniform float pixelRatio;

                    void main() {
                        vColor = color;
                        vRandom = random;
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        float breathe = 1.0 + 0.10 * sin(time * 1.5 + random * 6.28);
                        float twinkle = 1.0 + 0.20 * sin(time * 3.0 + random * 20.0);
                        gl_PointSize = size * pixelRatio * 380.0 / -mvPosition.z * breathe * twinkle;
                        gl_Position = projectionMatrix * mvPosition;
                    }
                `,
            fragmentShader: `
                    varying vec3 vColor;
                    varying float vRandom;
                    uniform float time;

                    void main() {
                        vec2 c = gl_PointCoord - vec2(0.5);
                        float d = length(c);
                        if (d > 0.5) discard;
                        float core = 1.0 - smoothstep(0.0, 0.12, d);
                        float mid  = 1.0 - smoothstep(0.0, 0.30, d);
                        float edge = 1.0 - smoothstep(0.0, 0.5, d);
                        float glow = core * 2.5 + mid * 1.0 + edge * 0.2;
                        vec3 col = vColor * (1.2 + glow * 2.0);
                        col = max(col, vColor * 0.8);
                        gl_FragColor = vec4(col, edge * 0.92);
                    }
                `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true,
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // ---------- 环境星点 ----------
        const AMBIENT_COUNT = 800;
        const aPos = new Float32Array(AMBIENT_COUNT * 3);
        const aCol = new Float32Array(AMBIENT_COUNT * 3);
        for (let i = 0; i < AMBIENT_COUNT; i++) {
            aPos[i * 3] = (Math.random() - 0.5) * 80;
            aPos[i * 3 + 1] = (Math.random() - 0.5) * 60;
            aPos[i * 3 + 2] = (Math.random() - 0.5) * 80;
            const intensity = 0.3 + Math.random() * 0.4;
            aCol[i * 3] = 1.0;
            aCol[i * 3 + 1] = 0.4 + Math.random() * 0.4;
            aCol[i * 3 + 2] = 0.5 + Math.random() * 0.3;
        }
        const aGeo = new THREE.BufferGeometry();
        aGeo.setAttribute('position', new THREE.BufferAttribute(aPos, 3));
        aGeo.setAttribute('color', new THREE.BufferAttribute(aCol, 3));
        const aMat = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.25,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
        });
        const ambientParticles = new THREE.Points(aGeo, aMat);
        scene.add(ambientParticles);

        // ---------- 状态 ----------
        let progress = 0; // 0=分散, 1=聚合
        let targetProgress = 0;
        const LERP_SPEED = 0.035;

        function updateParticles(p) {
            const pos = geometry.attributes.position.array;
            const inv = 1 - p;
            for (let i = 0; i < pos.length; i++) {
                pos[i] = aggPos[i] * p + dispPos[i] * inv;
            }
            geometry.attributes.position.needsUpdate = true;
        }
        updateParticles(0); // 默认分散

        // ---------- 手势识别 (MediaPipe) ----------
        let gestureDetected = false;
        let handGesture = 'open';

        const Hands = window.Hands;
        const Camera = window.Camera;

        if (Hands && Camera) {
            const hands = new Hands({
                locateFile: (file) =>
                    `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`,
            });

            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.6,
            });

            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const wrist = landmarks[0];
                    const tips = [4, 8, 12, 16, 20];
                    let totalDist = 0;
                    for (const idx of tips) {
                        const tip = landmarks[idx];
                        const dx = tip.x - wrist.x;
                        const dy = tip.y - wrist.y;
                        const dz = tip.z - wrist.z;
                        totalDist += Math.sqrt(dx * dx + dy * dy + dz * dz);
                    }
                    const avgDist = totalDist / tips.length;
                    const threshold = 0.5;
                    const isFist = avgDist < threshold;
                    handGesture = isFist ? 'fist' : 'open';
                    gestureDetected = true;
                    targetProgress = (handGesture === 'fist') ? 1.0 : 0.0;
                } else {
                    gestureDetected = false;
                    // 不改变 targetProgress，保持当前状态
                }
            });

            const video = document.createElement('video');
            const cameraObj = new Camera(video, {
                onFrame: async () => {
                    await hands.send({ image: video });
                },
                width: 640,
                height: 480,
            });

            cameraObj.start()
                .then(() => {
                    console.log('📷 摄像头已启动，手势识别就绪');
                    loadingOverlay.classList.add('hidden');
                })
                .catch((err) => {
                    console.warn('摄像头启动失败，手势不可用', err);
                    loadingOverlay.classList.add('hidden');
                });
        } else {
            console.warn('MediaPipe 未加载，手势不可用');
            loadingOverlay.classList.add('hidden');
        }

        // 强制隐藏加载遮罩（以防万一）
        setTimeout(() => {
            loadingOverlay.classList.add('hidden');
        }, 6000);

        // ---------- 动画循环 ----------
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 平滑过渡
            const diff = targetProgress - progress;
            if (Math.abs(diff) > 0.001) {
                progress += Math.sign(diff) * Math.min(Math.abs(diff), LERP_SPEED);
            } else {
                progress = targetProgress;
            }
            progress = Math.max(0, Math.min(1, progress));

            updateParticles(progress);

            material.uniforms.time.value = time;

            particles.rotation.y = time * 0.10;
            particles.position.y = Math.sin(time * 0.5) * 0.35;

            ambientParticles.rotation.y = -time * 0.025;
            ambientParticles.rotation.x = time * 0.015;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // ---------- 自适应 ----------
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            material.uniforms.pixelRatio.value = renderer.getPixelRatio();
        });

        console.log('🌹 3D Particle Rose · 纯手势控制 (握拳聚花，张手散花)');
    </script>
</body>
</html>
